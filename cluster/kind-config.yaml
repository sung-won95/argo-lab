kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argo-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Argo CD UI 를 호스트에서 바로 열기 위한 포트 (선택)
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
